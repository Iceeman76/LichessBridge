version: 2

updates:
  - package-ecosystem: nuget
    directories:
      - /Bridge
      - /LichessBridge
      - /LichessBridge.Tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
